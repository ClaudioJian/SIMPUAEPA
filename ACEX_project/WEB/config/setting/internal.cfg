#===================================================================================
# INTERNAL CONFIGURATION & USER GUIDE
#===================================================================================
#c: CRITICAL: Do not move or alter the location of this file. If you must relocate it,
#c: update the corresponding path constants inside 'Include/ENV_const.h' and recompile.
#c: 
#c: Runtime Execution: All values declared here are evaluated at runtime by setup.exe
#c: to manage internal application behaviors. Follow the formatting syntax rules 
#c: below carefully to prevent compilation or runtime errors.
#c:
#c: Scope Note: Unlike '.env.example', settings configured in this file ARE NOT 
#c: written to the output '.env' file. To modify output variables, edit '.env.example'.

#===================================================================================
# SYSTEM FLAGS & SYNTAX DIRECTIVES
#===================================================================================
#c: #c: -> Comment Escape: Escapes processing flags (l:, r:, s:, e:, o:, f:). Use this 
#c:        prefix to write developer notes containing flag characters safely.
#c:
#c:  l: -> Label / Description: Displays a prompt explaining the value's purpose. 
#c:        The console output will automatically prefix this text as: "Please set {text}"
#c:
#c:  r: -> Required Input: Marks the parameter as mandatory. The setup wizard will 
#c:        block empty inputs and force user input.
#c:
#c:  s: -> Static / Read-Only: Fixes the variable to its default value. It cannot be 
#c:        modified by the operator at runtime and cannot be left blank.
#c:        (If existing previous data, the conflict can be solved in run time)
#c:
#c:  e: -> Empty / Optional: Explicitly allows an empty value. If the user enters 
#c:        "null", the parameter will bypass generation and won't be written to '.env'.
#c:
#c:  o: -> Options List: Provides a pipe-separated (`|`) list of valid choices. 
#c:        Operators must type a positive integer to pick an option. If no choices 
#c:        follow this flag, the flag is automatically ignored.
#c:
#c:  f: -> Script Execution: Specifies a script file to execute during configuration.
#c:        - The target path is evaluated relative to the project root directory.
#c:        - Directives using this flag do not require a variable key name.
#c:        - Example: f: src/database/sample.php

#===================================================================================
# COMPILER RESTRICTIONS & VALIDATION RULES
#===================================================================================
#c: CRITICAL WARNING: DO NOT CHANGE VARIABLE KEY NAMES IN THIS FILE. Internal keys 
#c: are hardcoded into the setup executable. Modifying key names here will break parsing 
#c: unless you also update ENV_const.h and recompile the 'setup.exe' C source code.
#c:
#c: Flag Priority: Behavior modifiers (r, s, e) are mutually exclusive per variable. 
#c: If duplicate metadata flags are specified, only the final declared flag is parsed.
#c:
#c: Memory Allocation: Key and value string lengths are constrained by hardware buffer sizes. 
#c: Adjust limits inside 'Include/ENV_const.h' and recompile if larger bounds are needed.
#c:
#c: Interpreter Compatibility: The underlying runtime engine natively executes '.php' .
#c: You can trigger .sql file via php script instead
#c:
#c: Key Validation: Variable keys cannot begin with a number or restricted special 
#c: characters (e.g., [ ] , @ $ % \).
#c:
#c: Path Validation: For script file vectors, relative directory traversal paths 
#c: (like '../') and standard invalid system characters are strictly prohibited 
#c: (Note: this path validation filter is not entirely exhaustive).
#===================================================================================

#c:====================================display=====================================================

#l: display values for read-only variables. Internal uses value won't be displayed.
#o: true|false
#s:
SHOW_READ_ONLY = true

#l: whether to use a compact, single-line layout for variable inputs.
#o: true|false
#s:
SIMPLIFIED_DISPLAY = 1

#c:====================================debugs=====================================================

#l: enable safety confirmation. The system will ask for confirmation before running risk action.
#o: on|off
#s:
WARNING_FLAGS = on

#l: enable debug info. The system will show more detail of error.
#o: on|off
#s:
SHOW_DEBUG_INFO = off

#l: display location of code gets this error
#o: on|off
#s:
DISPLAY_ERROR_LINE = off

#l: where is php location
PHP_PATH = c:\xampp\php

