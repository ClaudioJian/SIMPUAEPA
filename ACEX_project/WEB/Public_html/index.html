// ================= LOGIN / AVATAR / LOGOUT =================

// impede que cliques no botão/menu ativem o clique do mapa
L.DomEvent.disableClickPropagation(document.getElementById('login-container'));

const btnLogin = document.getElementById('btn-login');
const userMenu = document.getElementById('user-menu');
const avatar   = document.getElementById('avatar');
const dropdown = document.getElementById('dropdown');

function mostrarLogado() {
    btnLogin.style.display = 'none';
    userMenu.style.display = 'block';
}

function mostrarDeslogado() {
    userMenu.style.display = 'none';
    dropdown.style.display = 'none';
    btnLogin.style.display = 'block';
}

function verificarLogin() {
    if (localStorage.getItem('uid')) {
        mostrarLogado();
    } else {
        mostrarDeslogado();
    }
}

// abre/fecha o menu ao clicar na bolinha
avatar.addEventListener('click', function (e) {
    e.stopPropagation();
    dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
});

// fecha o menu ao clicar fora
document.addEventListener('click', function () {
    dropdown.style.display = 'none';
});

// logout
document.getElementById('btn-logout').addEventListener('click', async function () {
    try {
        await fetch('/SIMPUAEPA/logout', { method: 'POST' });
    } catch (err) {
        console.error('Falha no logout:', err);
    }
    localStorage.removeItem('uid');
    mostrarDeslogado();
});

verificarLogin();
