<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Minha conta</title>
        <link rel="stylesheet" href="../Style/login.css">
        <link rel="stylesheet" href="../Style/minha-conta.css">
    </head>
    <body>

        <button id="themeToggle" class="theme-toggle" aria-label="Alternar Tema">
            <img id="themeIcon" src="../images/dia-e-noite.png" alt="Alterar tema">
        </button>

        <div class="login-container conta-container">

            <a href="../index.html" class="voltar">← Voltar ao mapa</a>
            <h1 class="conta-titulo">Minha conta</h1>

            <!-- DADOS ATUAIS -->
            <div class="perfil-topo">
                <div class="perfil-foto">
                    <svg id="fotoPadrao" viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true">
                        <circle cx="12" cy="12" r="12" fill="#bdc1c6"/>
                        <circle cx="12" cy="9" r="4" fill="white"/>
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6z" fill="white"/>
                    </svg>
                    <img id="fotoAtual" alt="Foto de perfil" hidden>
                </div>

                <div class="perfil-dados">
                    <div id="perfilNome" class="perfil-nome">Carregando...</div>
                    <div id="perfilEmail" class="perfil-email"></div>
                </div>
            </div>

            <!-- FOTO DE PERFIL -->
            <section class="conta-secao">
                <h2>Foto de perfil</h2>

                <input type="file" id="arquivoFoto" accept="image/*" hidden>

                <button type="button" id="btnEscolherFoto" class="btn-pequeno btn-secundario">
                    Escolher foto
                </button>

                <div id="editorFoto" class="editor-foto" hidden>
                    <p class="aviso">Arraste a imagem para enquadrar e use o controle para ampliar.</p>

                    <div class="recorte-area">
                        <canvas id="canvasRecorte" width="280" height="280"></canvas>
                    </div>

                    <input type="range" id="zoomFoto" class="zoom" min="1" max="3" step="0.01" value="1" aria-label="Ampliar">

                    <button type="button" id="btnSalvarFoto" class="btn-pequeno btn-primario">Salvar foto</button>
                    <button type="button" id="btnCancelarFoto" class="btn-pequeno btn-cancelar">Cancelar</button>
                </div>

                <p id="msgFoto" class="msg" role="alert"></p>
            </section>

            <!-- ALTERAR E-MAIL -->
            <form id="formEmail" class="conta-secao" novalidate>
                <h2>Alterar e-mail</h2>
                <p class="aviso">E-mail atual: <strong id="emailAtual">...</strong></p>

                <input type="email" id="novoEmail" placeholder="Novo e-mail">
                <input type="password" id="senhaEmail" placeholder="Senha atual" data-senha>

                <label class="mostrar-senha">
                    <input type="checkbox" class="toggle-senha">
                    Mostrar senha
                </label>

                <p id="msgEmail" class="msg" role="alert"></p>

                <button type="submit" class="btn-pequeno">Salvar e-mail</button>
            </form>

            <!-- ALTERAR SENHA -->
            <form id="formSenha" class="conta-secao" novalidate>
                <h2>Alterar senha</h2>

                <input type="password" id="senhaAtual" placeholder="Senha atual" data-senha>
                <input type="password" id="novaSenha" placeholder="Nova senha" data-senha>
                <input type="password" id="confirmarNovaSenha" placeholder="Confirmar nova senha" data-senha>

                <label class="mostrar-senha">
                    <input type="checkbox" class="toggle-senha">
                    Mostrar senha
                </label>

                <p id="msgSenha" class="msg" role="alert"></p>

                <button type="submit" class="btn-pequeno">Salvar senha</button>
            </form>

            <!-- EXCLUIR CONTA -->
            <section class="conta-secao">
                <h2>Excluir conta</h2>
                <p class="aviso">Essa ação é permanente e não pode ser desfeita.</p>

                <button type="button" id="btnAbrirExcluir" class="btn-pequeno btn-perigo-claro">
                    Excluir minha conta
                </button>

                <form id="formExcluir" novalidate hidden>
                    <input type="password" id="senhaExcluir" placeholder="Digite sua senha para confirmar" data-senha>

                    <label class="mostrar-senha">
                        <input type="checkbox" class="toggle-senha">
                        Mostrar senha
                    </label>

                    <p id="msgExcluir" class="msg" role="alert"></p>

                    <button type="submit" class="btn-pequeno btn-perigo">Confirmar exclusão</button>
                    <button type="button" id="btnCancelarExcluir" class="btn-pequeno btn-cancelar">Cancelar</button>
                </form>
            </section>

        </div>

        <script src="../UI/minha-conta.js"></script>
    </body>

    

</html>
