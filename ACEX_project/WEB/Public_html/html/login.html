<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fazer Login</title>
        <link rel="stylesheet" href="../Style/login.css">
    </head>
    <body>

        
        <button id="themeToggle" class="theme-toggle" aria-label="Alternar Tema">
            <img id="themeIcon" src="../images/dia-e-noite.png" alt="Alterar tema">
        </button>

        
        <div class="login-container">
            <form id="loginForm">

                <input type="email" id="email" name="email" placeholder="E-mail" required>

                <input type="password" id="password" name="password" placeholder="Senha" required>

                <button type="submit" class="btn-pequeno">Login</button>

                <a href="cadastro.html" class="btn-cadastro btn-pequeno">Cadastrar</a>

            </form>
        </div>

        <form action="/SIMPUAEPA/logout" method="POST">
            <button type="submit" class="btn-pequeno">LogOut</button>
        </form>

        
    </body>

    <script src="../API/api-client.js"></script>
    <script src="../UI/login.js"></script>

</html>
