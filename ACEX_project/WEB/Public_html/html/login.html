<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Login</title>
    <link rel="stylesheet" href="../Style/login.css">
</head>
<body>

    <div class="login-container">
        
        <form id="loginForm">    
            
            <input type="hidden" id="csrf_token" name="csrf_token" value="">

            <input type="email" id="email" name="email" placeholder="E-mail" required>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>
        
            <button type="submit" class="btn-pequeno">Login</button>
            <a href="cadastro.html" class="btn-cadastro btn-pequeno">Cadastrar</a>
        </form>
    </div>

    <script>
        
        const loginForm = document.getElementById('loginForm');

        
        loginForm.addEventListener('submit', async function(event) {
            
            event.preventDefault(); 

           
            const url = "/SIMPUAEPA-BackEnd/ACEX_project/API/router.php"; 

            
            const formData = new FormData(loginForm);

            try {
                
                const response = await fetch(url, {
                    method: "POST",
                    body: formData
                });

                
                if (!response.ok) {
                    throw new Error(`Erro no servidor: ${response.status}`);
                }

                
                const result = await response.json();
                console.log("Resposta do Servidor:", result);

                
                if (result.dataType === "user" && result.logged === true) {
                    alert("Login realizado com sucesso!");
                    
                    window.location.href = "../index.php"; 
                } else {
                    
                    alert("E-mail ou senha incorretos. Tente novamente.");
                }

            } catch (error) {
                
                console.error("Falha na requisição:", error.message);
                alert("Não foi possível conectar ao servidor.");
            }
        });
    </script>
    
</body>
</html>
