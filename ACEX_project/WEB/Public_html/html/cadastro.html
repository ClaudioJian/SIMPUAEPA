
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastre-se</title>
        <link rel="stylesheet" href="../Style/cadastro.css">
        
    </head>
    <body>

        <button id="themeToggle" class="theme-toggle">
            <img id="themeIcon" src="../images/dia-e-noite.png" alt="Alterar tema">
        </button>

        <div class="login-container">
            
            <form id="registerForm">

                <input type="text" name="name" id="name" placeholder="Nome Completo" required>
                <p id="erroName" class="mensagem-erro" role="alert"></p>

                <input type="email" id="email" name="email" placeholder="E-mail" required>
                <p id="erroEmail" class="mensagem-erro" role="alert"></p>

                <input type="password" name="password" id="password" placeholder="Senha" required>
                <p id="erroPassword" class="mensagem-erro" role="alert"></p>

                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirmar Senha" required>
                <p id="erroConfirm" class="mensagem-erro" role="alert"></p>

                <label class="mostrar-senha">
                    <input type="checkbox" id="mostrarSenha">
                    Mostrar senha
                </label>

                <p id="erroGeral" class="mensagem-erro" role="alert"></p>

                <button type="submit" class="btn-pequeno">Cadastrar</button>
                <a href="login.html" class="btn-cadastro btn-pequeno">Já tenho conta (Login)</a>
            </form>

        </div>

            

    </body>

    <script src="../API/api-client.js"></script>
    <script src="../UI/cadastro.js"></script>

</html>
