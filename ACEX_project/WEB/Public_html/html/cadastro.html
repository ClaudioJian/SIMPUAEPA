


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="../Style/cadastro.css">
</head>
<body>

    <div class="login-container">
        
        <form id="registerForm">    
            <input type="text" name="nome" id="nome" placeholder="Nome Completo" required>
            <input type="email" id="email" name="email" placeholder="E-mail" required>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>
            <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirmar Senha" required>
        
            <button type="submit" class="btn-pequeno">Cadastrar</button>
            <a href="login.html" class="btn-cadastro btn-pequeno">Já tenho conta (Login)</a>
        </form>
    </div>

        <form action="/SIMPUAEPA/logout" method="POST">
            <button type="submit" class="btn-pequeno">LogOut</button>
        </form>

    <script>
        const registerForm = document.getElementById('registerForm');

        registerForm.addEventListener('submit', async function(event) {
            
            event.preventDefault(); 

            const name = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmar_senha').value;

            const data = {
                name:name, email: email, password:password
            }

            if (password !== confirmarSenha) {
                alert("As senhas não coincidem! Por favor, verifique.");
                return; 
            }

          
            const url = "/SIMPUAEPA/subscribe"; 
            
            

            try {
               
                const response = await fetch(url, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                console.log("Resposta do Servidor:", result);
            } catch (error) {
                console.error("Falha na requisição:", error.message);
                alert("Não foi possível conectar ao servidor para realizar o cadastro.");
            }
        });
    </script>

</body>
<script src="../API/api-client.js"></script>
</html>
