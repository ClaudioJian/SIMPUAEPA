<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pão com ovo</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <link rel="stylesheet" href="mapeamento-css.css"/>
</head>
<body>
    <div id="map">
        <script >
            var map = L.map('map').setView([51.505, -0.09], 13); // localização no mapa.
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { // ter que ter o copyright para marcar o lugar.
    maxZoom: 19, //o site também é para pegar o lugar para poder usar o mapa, usaremos openstreetmap.
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>' //teremos que fazer essa exportação 
        //quando fizer o trabalho
}).addTo(map);

    var defaultIcon = L.icon({
    iconUrl: 'icones/default.png', // Aqui é onde define a imagem do icone, necessário a pasta para organização
    //shadowUrl: 'leaf-shadow.png', // não vamos fazer com sombra, fica estranho e é desnecessário

    iconSize:     [55, 50], // size of the icon
    shadowSize:   [50, 64], // size of the shadow
    iconAnchor:   [0, 0], // point of the icon which will correspond to marker's location
    shadowAnchor: [4, 62],  // the same for the shadow
    popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
});

    L.marker([51.5, -0.09], {icon: defaultIcon}).addTo(map);
    var LeafIcon = L.Icon.extend({
    options: {
        //shadowUrl: 'leaf-shadow.png', // não vamos fazer com sombra, fica estranho e é desnecessário
        iconSize:     [50, 50],     //o tamanho do icone, idealmente 40-50 de tamanho
        //shadowSize:   [50, 64], // não vamos fazer com sombra, fica estranho e é desnecessário
        iconAnchor:   [0, 0],     //o ponto de onde o ponto aparece em relação a marcação, melhor deixar zerado
        //shadowAnchor: [4, 62], // não vamos fazer com sombra, fica estranho e é desnecessário
        popupAnchor:  [25, -3] // onde que aparece o texto, do que testado, essa séria a melhor configuração
    }
});
    var defaultIcon = new LeafIcon({iconUrl: 'icones/default.png'}), //como declarar um ponto novo
    perigoIcon = new LeafIcon({iconUrl: 'icones/perigo.png'}),  //dessa vez com outro icone
    outroIcon = new LeafIcon({iconUrl: 'icones/outro.png'});    // também com outro icone
    L.icon = function (options) {
    return new L.Icon(options);
};
    L.marker([51.510, -0.09], {icon: defaultIcon}).addTo(map).bindPopup("Eu sou uma marcação default."); //seleção do ponto no mapa com sua localização, icone e popup
L.marker([51.495, -0.083], {icon: perigoIcon}).addTo(map).bindPopup("Eu sou uma marcação de perigo.");//seleção do ponto no mapa com sua localização, icone e popup
L.marker([51.49, -0.1], {icon: outroIcon}).addTo(map).bindPopup("Eu sou uma marcação de ."); //pequena diferença entre a seleção do icone e do pop up
        </script>
</body>
</html>
